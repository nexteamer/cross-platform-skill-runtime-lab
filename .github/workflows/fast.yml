name: fast

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install jsonschema==4.19.2 pytest==9.0.3 platformdirs==4.3.6 psutil==7.2.2 flask==3.0.3
      - name: Run acceptance tests
        env:
          PYTHONPATH: src
          PRODUCTCTL_ALLOW_REAL_CODEX: "0"
        run: python -m pytest --junitxml=pytest.xml
      - name: Job receipt
        if: always()
        shell: bash
        run: |
          echo "os=${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "python=${{ matrix.python }}" >> "$GITHUB_STEP_SUMMARY"
          echo "result=${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized failure bundle
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: failure-${{ matrix.os }}-${{ matrix.python }}
          path: pytest.xml
          retention-days: 7
          if-no-files-found: warn
